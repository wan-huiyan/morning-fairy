<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- ticket body (blue-300: reads on cream, grey and dark tabs) with notched sides -->
  <rect x="3" y="4" width="10" height="1" fill="#93c5fd"/>
  <rect x="2" y="5" width="12" height="2" fill="#93c5fd"/>
  <rect x="3" y="7" width="10" height="2" fill="#93c5fd"/>
  <rect x="2" y="9" width="12" height="2" fill="#93c5fd"/>
  <rect x="3" y="11" width="10" height="1" fill="#93c5fd"/>
  <!-- eyes -->
  <rect x="5" y="6" width="1" height="2" fill="#1e293b"/>
  <rect x="10" y="6" width="1" height="2" fill="#1e293b"/>
  <!-- blush (pink-500) -->
  <rect x="4" y="8" width="1" height="1" fill="#ec4899"/>
  <rect x="11" y="8" width="1" height="1" fill="#ec4899"/>
  <!-- smile -->
  <rect x="6" y="8" width="1" height="1" fill="#1e293b"/>
  <rect x="9" y="8" width="1" height="1" fill="#1e293b"/>
  <rect x="7" y="9" width="2" height="1" fill="#1e293b"/>
  <!-- sparkle (amber-500) -->
  <rect x="13" y="1" width="1" height="3" fill="#f59e0b"/>
  <rect x="12" y="2" width="3" height="1" fill="#f59e0b"/>
</svg>
