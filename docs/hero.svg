<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-label="morning-fairy: a ticket mascot standing on the hills of the day, under a smiling sun">
<style>
.bob{animation:bob 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.tw{animation:tw 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center;opacity:.2}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
.sun{animation:spin 30s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bob,.tw,.sun{animation:none}.tw{opacity:.8}}
</style>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4dd"/><stop offset="1" stop-color="#fde7e7"/></linearGradient>
<linearGradient id="mbody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2e0ff"/><stop offset="1" stop-color="#7cb2f6"/></linearGradient>
</defs>
<rect width="880" height="320" rx="28" fill="url(#sky)"/>
